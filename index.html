<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="description" content="오정훈의 포트폴리오. Unity로 만든 VR·AI 프로젝트 STILL, 아르띠, 인체탐험 VR을 가상 공간에서 둘러보세요.">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>오정훈 — 직접 들어가서 겪는 가상 공간</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=20261110c">
<script defer src="config.js?v=20261110c"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module" src="app.js?v=20261110c"></script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>

<header class="top">
  <a class="brand" href="./" aria-label="처음 공간으로">OJH</a>
  <nav aria-label="연락처"><a id="link-github" target="_blank" rel="noopener noreferrer">GitHub</a><a id="link-mail">메일</a></nav>
</header>

<main>
  <section id="intro" class="intro" aria-label="소개"></section>

  <nav id="doors" aria-label="프로젝트 공간"></nav>
  <div class="pager" aria-hidden="true">
    <button id="prev-door" type="button" aria-label="이전 공간" tabindex="-1">‹</button>
    <button id="next-door" type="button" aria-label="다음 공간" tabindex="-1">›</button>
  </div>
  <p class="hint" id="hint">문을 누르면 그 공간으로 들어갑니다</p>

  <section id="room" aria-live="polite" aria-label="프로젝트 설명">
    <div class="flat" id="flat"></div>
    <div class="txt" id="room-text"></div>
  </section>
  <div id="media" aria-label="프로젝트 화면">
    <p class="cap" id="media-cap"></p>
    <div class="tabs" id="media-tabs" role="group" aria-label="보여 줄 화면 고르기"></div>
  </div>
  <div class="roomnav">
    <button id="back" type="button">← 처음 공간으로</button>
    <button id="next" type="button">다음 공간 →</button>
  </div>
</main>

<div id="fade" aria-hidden="true"></div>
<noscript><p class="noscript">이 페이지는 JavaScript가 필요합니다. <a href="https://github.com/jeonghun267">GitHub에서 프로젝트 보기</a></p></noscript>
